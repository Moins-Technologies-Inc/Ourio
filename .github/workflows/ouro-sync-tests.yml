# Offline tests of the Ourio upstream sync decision (E337) on every PR that
# touches it. The sync job runs them too before it pushes.
name: Ourio sync tests

on:
  pull_request:
    paths:
      - ".github/ouro/**"
      - ".github/workflows/ouro-upstream-sync.yml"
      - ".github/workflows/ouro-sync-tests.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/ouro -p 'test_*.py'
